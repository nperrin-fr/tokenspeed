api_version: ci.tokenspeed.io/v1
name: ut-runtime-2gpu
type: ut
workflow_stage: unit-test
triggers:
  - per-commit
  - manual
runner:
  labels:
    - h100-2gpu
    - b200-2gpu
    - gb200-2gpu
    - amd-mi35x-2gpu-test
env:
  CI: "true"
install:
  - bash test/ci_system/install_deps.sh
ut:
  commands:
    - python3 test/runtime/run_ci_suite.py --device cuda --suite runtime-2gpu
    - python3 -m torch.distributed.run --standalone --nproc-per-node=2 -m pytest -q tokenspeed-kernel/test/nvidia/ops/moe/test_latent_tail_distributed.py
report:
  github_step_summary: true
